name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-parse:
    name: Offline parsing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio aiohttp astral

      - name: Run offline tests
        run: pytest -m "not live" -v

  test-live:
    name: Live fetch tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio aiohttp astral

      - name: Run live tests
        run: pytest -m live -v
